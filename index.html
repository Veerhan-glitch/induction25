<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Induction '26</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .wrapper {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #dynamic-img {
            width: 85%; 
            max-height: 80vh;
            object-fit: contain;
            /* Forces the browser to keep edges sharp */
            image-rendering: -webkit-optimize-contrast; 
            image-rendering: crisp-edges;
            
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img id="dynamic-img" src="Induction26.png" alt="Induction 26 Placeholder">
    </div>

    <script>
        const sheetId = '1YdBnzSVSvL7EkFFUY4p0XWrL-swFdtrIFo_vr_8mFgk';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&range=A1`;
        const imgElement = document.getElementById('dynamic-img');
        const fallbackSrc = "Induction26.png";

        imgElement.onerror = function() {
            this.src = fallbackSrc;
        };

        async function fetchImageFromExcel() {
            try {
                const response = await fetch(url);
                const data = await response.text();
                const cleanUrl = data.replace(/["]+/g, '').trim();

                if (cleanUrl && cleanUrl.startsWith('http')) {
                    imgElement.src = cleanUrl;
                }
            } catch (err) {
                imgElement.src = fallbackSrc;
            } finally {
                imgElement.style.opacity = '1';
            }
        }

        fetchImageFromExcel();
    </script>
</body>
</html>
